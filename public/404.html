<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found - Resourcify</title>
    <meta
      name="description"
      content="The page you were looking for could not be found on Resourcify."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/icons/resourcify-192.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a1a1a;
        color: #e5e7eb;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 2rem;
      }
      main {
        max-width: 30rem;
        text-align: center;
      }
      h1 {
        font-size: 3rem;
        font-weight: 300;
        color: #6c8fff;
        margin: 0 0 0.5rem;
      }
      p {
        color: #9ca3af;
        line-height: 1.6;
        margin: 0 0 2rem;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border: 1px solid #6c8fff;
        border-radius: 8px;
        color: #6c8fff;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        background: #6c8fff;
        color: #1a1a1a;
      }
      @media (max-width: 480px) {
        h1 {
          font-size: 2.25rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>
        That page doesn't exist. Everything in Resourcify is reachable from the
        home screen.
      </p>
      <a href="/">Back to Resourcify</a>
    </main>
  </body>
</html>
